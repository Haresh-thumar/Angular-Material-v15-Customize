<h1>Mat-Button Customize</h1>
<br><br>


<!--===========================================================================================================================================
                                                                ByDefault Button
============================================================================================================================================-->
<div class="example-button-row">
    <!----------------------------------- Basic Button ------------------------------------->
    <div class="button-set">
        <p>Basic Button</p>
        <hr>
        <button mat-button color="primary">Primary</button>
        <button mat-button color="accent">Accent</button>
        <button mat-button color="warn">Warn</button>
        <button mat-button disabled>Disabled</button>
    </div>

    <!----------------------------------- Raised Button ------------------------------------->
    <div>
        <p>Raised Button</p>
        <hr>
        <button mat-raised-button color="primary">Primary</button>
        <button mat-raised-button color="accent">Accent</button>
        <button mat-raised-button color="warn">Warn</button>
    </div>

    <!----------------------------------- Stroked Button ------------------------------------->
    <div>
        <p>Stroked Button</p>
        <hr>
        <button mat-stroked-button color="primary">Stroked</button>
        <button mat-stroked-button color="accent">Accent</button>
        <button mat-stroked-button color="warn">Warn</button>
    </div>

    <!----------------------------------- Flat Button ------------------------------------->
    <div>
        <p>Flat Button</p>
        <hr>
        <button mat-flat-button color="primary">Flat</button>
        <button mat-flat-button color="accent">Accent</button>
        <button mat-flat-button color="warn">Warn</button>
    </div>

    <!----------------------------------- Icon Button ------------------------------------->
    <div>
        <p>Icon Button</p>
        <hr>
        <button mat-icon-button color="primary">
            <mat-icon>home</mat-icon>
        </button>
        <button mat-icon-button color="accent">
            <mat-icon>bookmark</mat-icon>
        </button>
        <button mat-icon-button color="warn">
            <mat-icon>favorite</mat-icon>
        </button>
    </div>

    <!----------------------------------- FAB Button ------------------------------------->
    <div>
        <p>FAB Button</p>
        <hr>
        <button mat-fab color="primary" class="matFab1">
            <mat-icon>home</mat-icon>
        </button>
        <button mat-fab color="accent" class="matFab2">
            <mat-icon>bookmark</mat-icon>
        </button>
        <button mat-fab color="warn" class="matFab3">
            <mat-icon>favorite</mat-icon>
        </button>
    </div>

    <!----------------------------------- Mini-FAB Button ------------------------------------->
    <div>
        <p>Mini-FAB Button</p>
        <hr>
        <button mat-mini-fab color="primary" class="matMiniFab1">
            <mat-icon>bookmark</mat-icon>
        </button>
        <button mat-mini-fab color="accent" class="matMiniFab2">
            <mat-icon>favorite</mat-icon>
        </button>
        <button mat-mini-fab color="warn" class="matMiniFab3">
            <mat-icon>delete</mat-icon>
        </button>
    </div>

</div>


<br><br><br><br>
