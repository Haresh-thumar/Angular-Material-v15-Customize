<h1>Mat-Progress Spinner Customize</h1>

<br><br>

<!------------------------------------- Bydefault Progress-Spinner -------------------------------------->
<h3>Progress Spinner Mode :- diameter & indeterminate</h3>
<div class="example-button-row">
  <mat-spinner mode="indeterminate" color="primary" diameter="30"></mat-spinner>
  <mat-spinner mode="indeterminate" color="accent" diameter="50"></mat-spinner>
  <mat-spinner mode="indeterminate" color="warn" diameter="70"></mat-spinner>
  <mat-spinner mode="indeterminate" color="success" diameter="90"></mat-spinner>
  <mat-spinner mode="indeterminate" color="warning" diameter="110"></mat-spinner>
  <mat-spinner mode="indeterminate" color="danger" diameter="130"></mat-spinner>
</div>

<br>
<hr>
<br>

<h3>Progress Spinner Mode :- determinate</h3>
<div class="example-button-row">
  <mat-spinner mode="determinate" color="primary" value="30" diameter="30"></mat-spinner>
  <mat-spinner mode="determinate" color="accent" value="40" diameter="50"></mat-spinner>
  <mat-spinner mode="determinate" color="warn" value="50" diameter="70"></mat-spinner>
  <mat-spinner mode="determinate" color="success" value="60" diameter="90"></mat-spinner>
  <mat-spinner mode="determinate" color="warning" value="70" diameter="110"></mat-spinner>
  <mat-spinner mode="determinate" color="danger" value="80" diameter="130"></mat-spinner>
</div>

<br>
<hr>
<br>

<h3>Progress Spinner :-</h3>
<div class="example-button-row">
  <mat-spinner mode="indeterminate" color="primary" value="30" diameter="30" strokeWidth="10"></mat-spinner>
  <mat-spinner mode="indeterminate" color="accent" value="40" diameter="40" strokeWidth="15"></mat-spinner>
  <mat-spinner mode="indeterminate" color="warn" value="50" diameter="50" strokeWidth="20"></mat-spinner>
  <mat-spinner mode="indeterminate" color="success" value="60" diameter="60" strokeWidth="25"></mat-spinner>
  <mat-spinner mode="indeterminate" color="warning" value="70" diameter="70" strokeWidth="30"></mat-spinner>
  <mat-spinner mode="indeterminate" color="danger" value="90" diameter="80" strokeWidth="40"></mat-spinner>
</div>
