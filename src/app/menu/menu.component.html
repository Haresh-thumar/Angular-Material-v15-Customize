<h1>Mat-Menu Customize</h1>
<br>
<!---------------------------------------------------------------------------------------------------
                                        Custom Menu
---------------------------------------------------------------------------------------------------->
<p>Custom Menu</p>
<div class="grid-box">
    <!------------- Primary Menu --------------->
    <div>
        <button mat-flat-button color="primary" [matMenuTriggerFor]="menu1">Menu</button>
        <mat-menu #menu1="matMenu" class="menu-primary">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
            <button mat-menu-item>Item 3</button>
            <button mat-menu-item>Item 4</button>
            <button mat-menu-item>Item 5</button>
        </mat-menu>
    </div>
    <!------------- Accent Menu --------------->
    <div>
        <button mat-flat-button color="accent" [matMenuTriggerFor]="menu2">Menu</button>
        <mat-menu #menu2="matMenu" class="menu-accent">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
            <button mat-menu-item>Item 3</button>
            <button mat-menu-item>Item 4</button>
            <button mat-menu-item>Item 5</button>
        </mat-menu>
    </div>
    <!------------- Warn Menu --------------->
    <div>
        <button mat-flat-button color="warn" [matMenuTriggerFor]="menu3">Menu</button>
        <mat-menu #menu3="matMenu" class="menu-warn">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
            <button mat-menu-item>Item 3</button>
            <button mat-menu-item>Item 4</button>
            <button mat-menu-item>Item 5</button>
        </mat-menu>
    </div>
    <!------------- Danger Menu --------------->
    <div>
        <button mat-flat-button class="Danger-button" [matMenuTriggerFor]="menu4">Menu</button>
        <mat-menu #menu4="matMenu" class="menu-danger">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
            <button mat-menu-item>Item 3</button>
            <button mat-menu-item>Item 4</button>
            <button mat-menu-item>Item 5</button>
        </mat-menu>
    </div>
    <!------------- Secondary Menu --------------->
    <div>
        <button mat-flat-button class="Secondary-button" [matMenuTriggerFor]="menu5">Menu</button>
        <mat-menu #menu5="matMenu" class="menu-secondary">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
            <button mat-menu-item>Item 3</button>
            <button mat-menu-item>Item 4</button>
            <button mat-menu-item>Item 5</button>
        </mat-menu>
    </div>
</div>

<!---------------------------------------------------------------------------------------------------
                                            Menu positioning
---------------------------------------------------------------------------------------------------->
<p>Menu positioning</p>
<div class="grid-box">
    <!------------- Open Top Side Menu --------------->
    <div>
        <button mat-flat-button color="primary" [matMenuTriggerFor]="aboveMenu">Above</button>
        <mat-menu #aboveMenu="matMenu" yPosition="above" class="menu-primary">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
        </mat-menu>
    </div>
    <!------------- Open Bottom Side Menu --------------->
    <div>
        <button mat-flat-button color="accent" [matMenuTriggerFor]="belowMenu">Below</button>
        <mat-menu #belowMenu="matMenu" yPosition="below" class="menu-accent">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
        </mat-menu>
    </div>
    <!------------- Open Left Side Menu --------------->
    <div>
        <button mat-flat-button color="warn" [matMenuTriggerFor]="beforeMenu">Before</button>
        <mat-menu #beforeMenu="matMenu" xPosition="before" class="menu-warn">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
        </mat-menu>
    </div>
    <!------------- Open Right Side Menu --------------->
    <div>
        <button mat-flat-button class="Danger-button" [matMenuTriggerFor]="afterMenu">After</button>
        <mat-menu #afterMenu="matMenu" xPosition="after" class="menu-danger">
            <button mat-menu-item>Item 1</button>
            <button mat-menu-item>Item 2</button>
        </mat-menu>
    </div>
</div>
