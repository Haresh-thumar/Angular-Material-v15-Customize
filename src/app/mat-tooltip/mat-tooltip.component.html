<h1>Customize Mat-Tooltip</h1>

<br><br><br>

<!-----------------------------------------------------------------------------------------------
                                    Customize Mat-Tooltip
------------------------------------------------------------------------------------------------>
<button mat-raised-button matTooltip="Info about the action" matTooltipPosition="above"
    matTooltipClass="danger-tooltip"> Uppercase-tooltip Action
</button>

<button mat-raised-button matTooltip="Info about the action" matTooltipPosition="right"
    matTooltipClass="primary-tooltip"> Uppercase-tooltip Action
</button>

<button mat-raised-button matTooltip="Info about the action" matTooltipPosition="below"
    matTooltipClass="warning-tooltip"> Uppercase-tooltip Action
</button>

<button mat-raised-button matTooltip="Info about the action" matTooltipPosition="left"
    matTooltipClass="success-tooltip"> Uppercase-tooltip Action
</button>

<button mat-raised-button matTooltip="Info about the action" matTooltipPosition="right"
    matTooltipClass="dark-tooltip"> Uppercase-tooltip Action
</button>
