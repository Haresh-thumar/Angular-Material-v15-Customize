<h1>Customize Mat-Progress Bar</h1>

<br><br>

<!------------------------------ ByDefault Progress-Bar --------------------------------->
<p>ByDefault Theme Color</p>
<mat-progress-bar mode="indeterminate" color="accent"></mat-progress-bar>
<br><br>

<mat-progress-bar mode="determinate" value="40" color="primary"></mat-progress-bar>
<br><br>

<mat-progress-bar mode="query" color="warn"></mat-progress-bar>
<br><br>

<mat-progress-bar mode="buffer" value="25" color="primary"></mat-progress-bar>
<br><br>


<!------------------------------ Custom Progress-Bar --------------------------------->
<p>Custom Theme Color</p>
<mat-progress-bar mode="indeterminate" color="success"></mat-progress-bar>
<br><br>

<mat-progress-bar mode="determinate" value="40" color="warning"></mat-progress-bar>
<br><br>

<mat-progress-bar mode="query" color="danger"></mat-progress-bar>
<br><br>

<mat-progress-bar mode="buffer" value="25" color="info"></mat-progress-bar>
<br><br>
