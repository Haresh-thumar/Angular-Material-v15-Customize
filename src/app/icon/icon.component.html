<h1>Customize Mat-icon</h1>
<br><br>

<!------------------- Customize Icon (Theme Color) ------------------->
<div class="example-buttons-row">
    <mat-icon fontIcon="home" color="primary"></mat-icon>
    <mat-icon fontIcon="home" color="accent"></mat-icon>
    <mat-icon fontIcon="home" color="warn"></mat-icon>
</div>


<br><br>

<!------------------- Customize Icon (Own Color) ------------------->
<div class="example-buttons-row">
    <mat-icon fontIcon="home" color="success"></mat-icon>
    <mat-icon fontIcon="home" color="danger"></mat-icon>
    <mat-icon fontIcon="home" color="warning"></mat-icon>
    <mat-icon fontIcon="home" color="info"></mat-icon>
    <mat-icon fontIcon="home" color="teal"></mat-icon>
</div>
