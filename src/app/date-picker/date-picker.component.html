<h1>Mat-Date-Picker Customize</h1>
<br><br>
<!------------------------------------------------------------------------------------------
                                    Bydefault Theme Color
------------------------------------------------------------------------------------------->
<div class="grid-box">
    <p>Bydefault Theme Color</p>
    <!------------ Primary Color ------------>
    <div>
        <mat-form-field class="example-full-width" appearance="outline" color="primary">
            <mat-label>Choose a date</mat-label>
            <input matInput [matDatepicker]="picker">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
    </div>
    <!------------ Accent Color ------------>
    <div>
        <mat-form-field class="example-full-width" appearance="outline" color="accent">
            <mat-label>Choose a date</mat-label>
            <input matInput [matDatepicker]="picker1">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker1"></mat-datepicker-toggle>
            <mat-datepicker #picker1></mat-datepicker>
        </mat-form-field>
    </div>
    <!------------ Warn Color ------------>
    <div>
        <mat-form-field class="example-full-width" appearance="outline" color="warn">
            <mat-label>Choose a date</mat-label>
            <input matInput [matDatepicker]="picker2">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker2"></mat-datepicker-toggle>
            <mat-datepicker #picker2></mat-datepicker>
        </mat-form-field>
    </div>
</div>
<!---------------------------------------------------------------------------------------------------
                                        Datepicker with Icon
---------------------------------------------------------------------------------------------------->
<div class="grid-box">
    <div>
        <mat-form-field class="example-full-width" appearance="fill" color="primary">
            <mat-label>Choose a date</mat-label>
            <input matInput [matDatepicker]="picker3">
            <mat-hint>MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker3">
                <mat-icon matDatepickerToggleIcon>keyboard_arrow_down</mat-icon>
            </mat-datepicker-toggle>
            <mat-datepicker #picker3></mat-datepicker>
        </mat-form-field>
    </div>
    <div>
        <mat-form-field class="example-full-width" appearance="fill">
            <mat-label>Enter a date range</mat-label>
            <mat-date-range-input [rangePicker]="picker4">
                <input matStartDate placeholder="Start date">
                <input matEndDate placeholder="End date">
            </mat-date-range-input>
            <mat-hint>MM/DD/YYYY - MM/DD/YYYY</mat-hint>
            <mat-datepicker-toggle matIconSuffix [for]="picker4"></mat-datepicker-toggle>
            <mat-date-range-picker #picker4></mat-date-range-picker>
        </mat-form-field>
    </div>
</div>
