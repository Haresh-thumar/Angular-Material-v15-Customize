<h1>Customize Mat-Snack-Bar</h1>

<br><br>

<!--------------------------------------------------------------------------------------------------------------
                                              Custom Theme Color
--------------------------------------------------------------------------------------------------------------->
<div class="box-container">
  <button mat-raised-button color="accent" (click)="openSnackBar1()">Top-Left</button>
  <button mat-raised-button color="accent" (click)="openSnackBar2()">Top-center</button>
  <button mat-raised-button color="primary" (click)="openSnackBar3()">Top-Right</button>
  <button mat-raised-button color="primary" (click)="openSnackBar4()">Bottom-Left</button>
  <button mat-raised-button color="warn" (click)="openSnackBar5()">Bottom-center</button>
  <button mat-raised-button color="warn" (click)="openSnackBar6()">Bottom-right</button>
</div>
