<h1>Customize Mat-Slide-Toggle</h1>

<br><br>


<!--------------------- ByDefault Theme Color ----------------------->
<p>ByDefault Theme Color</p>
<div class="grid-box">
    <div>
        <mat-slide-toggle color="accent" disabled="true">Disable State</mat-slide-toggle>
    </div>

    <div>
        <mat-slide-toggle color="accent">Slide Toggle 1</mat-slide-toggle>
    </div>

    <div>
        <mat-slide-toggle color="primary">Slide Toggle 2</mat-slide-toggle>
    </div>

    <div>
        <mat-slide-toggle color="warn">Slide Toggle 3</mat-slide-toggle>
    </div>
</div>



<!--------------------- Custom Theme Color ----------------------->
<p>Custom Theme Color</p>
<div class="grid-box">
    <div>
        <mat-slide-toggle color="success">Slide Toggle 4</mat-slide-toggle>
    </div>

    <div>
        <mat-slide-toggle color="warning">Slide Toggle 5</mat-slide-toggle>
    </div>

    <div>
        <mat-slide-toggle color="danger">Slide Toggle 6</mat-slide-toggle>
    </div>
</div>
