<h1>Customize Mat-Paginator</h1>
<br><br>

<div class="grid-box">
    <!-----------------------------------------------------------------
                                Primary Theme
    ------------------------------------------------------------------>
    <div>
        <p>Primary Theme Paginator</p>
        <mat-paginator [length]="100" [pageSize]="10" [pageSizeOptions]="[10, 20, 30]"></mat-paginator>
    </div>

    <!-----------------------------------------------------------------
                                Accent Theme
    ------------------------------------------------------------------>
    <div>
        <p>Accent Theme Paginator</p>
        <mat-paginator [length]="200" [pageSize]="20" [pageSizeOptions]="[20, 40, 60]" class="accent-paginator"></mat-paginator>
    </div>

    <!-----------------------------------------------------------------
                                Warn Theme
    ------------------------------------------------------------------>
    <div>
        <p>Warn Theme Paginator</p>
        <mat-paginator [length]="300" [pageSize]="30" [pageSizeOptions]="[30, 60, 90]" class="warn-paginator"></mat-paginator>
    </div>
</div>
